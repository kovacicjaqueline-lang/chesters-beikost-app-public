name: App regression tests

on:
  push:
    branches-ignore: [main]
    paths:
      - 'index.html'
      - '**/*.css'
      - 'sw.js'
      - 'sw-core.js'
      - 'app.js'
      - 'js/**'
      - 'data/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - '**/*.css'
      - 'sw.js'
      - 'sw-core.js'
      - 'app.js'
      - 'js/**'
      - 'data/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: write

jobs:
  finalize-visible-terminology:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/unified-food-log'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-food-log
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final visible terminology cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old}')
              p.write_text(text.replace(old, new, 1))

          ui = Path('js/ui.js')
          text = ui.read_text()
          replacements = [
              (': role === "sample" ? "Kostprobe"', ': role === "sample" ? "Einführung"'),
              ('${d.introAssigned ? "Einführung / Wiederholung" : "Bekannter Tag"}', '${d.introAssigned ? "Einführung und Wiederholung" : "Bekannter Tag"}'),
              ('<div class="field"><label>Sichere Form / Notiz</label><textarea id="customSafe"></textarea></div>', '<div class="field"><label>Sichere Form oder Notiz</label><textarea id="customSafe"></textarea></div>'),
              ('<select id="customCat">${cats.map((c) => `<option>${c}</option>`).join("")}</select>', '<select id="customCat">${cats.map((c) => `<option value="${esc(c)}">${esc(uiFoodCategoryDisplayLabel(c))}</option>`).join("")}</select>'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ui.js: expected one occurrence, found {count}: {old}')
              text = text.replace(old, new, 1)

          marker = 'function addCustomFoodForm(options = {}) {'
          helper = '''function uiFoodCategoryDisplayLabel(category) {\n  if (typeof foodCategoryLabel === "function") return foodCategoryLabel(category);\n  let value = String(category || "");\n  return {\n    "Getreide/Stärke": "Getreide und Stärke",\n    "Kraut/Gewürz": "Kräuter und Gewürze",\n    "Wurzel/Knolle": "Wurzel- und Knollengemüse",\n    "Soja/Tofu": "Soja und Tofu",\n  }[value] || value;\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit('ui.js: addCustomFoodForm marker missing or duplicated')
          text = text.replace(marker, helper + marker, 1)
          ui.write_text(text)

          replace_once(
              'tests/manual-meal-flow-regressions.test.cjs',
              'planningSource.includes("return `${naturalMealFoodTitle(base)} und ${sampleName} als Kostprobe`;")',
              'planningSource.includes("return `${naturalMealFoodTitle(base)} mit ${sampleName} zur ${role}`;")',
          )
          replace_once(
              'tests/manual-meal-flow-regressions.test.cjs',
              '"bestehende Mahlzeitenbenennung für Basis + Kostprobe muss erhalten bleiben"',
              '"bestehende Mahlzeitenbenennung für Basis + Einführung muss erhalten bleiben"',
          )

          browser = Path('browser-tests/ui-meal-editor-webkit.test.mjs')
          b = browser.read_text()
          browser_replacements = [
              ('/Pfirsich|Kostprobe/', '/Pfirsich|Einführung|Wiederholung/'),
              ('"Pfirsich muss als Kostprobe geführt werden"', '"Pfirsich muss als Einführung geführt werden"'),
              ('/Banane.*Pfirsich.*Kostprobe/', '/Banane.*Pfirsich.*Einführung/'),
              ('"Kartentitel muss Hauptbasis und Kostprobe repräsentieren"', '"Kartentitel muss Hauptbasis und Einführung repräsentieren"'),
          ]
          for old, new in browser_replacements:
              if b.count(old) != 1:
                  raise SystemExit(f'browser test: expected one occurrence, found {b.count(old)}: {old}')
              b = b.replace(old, new, 1)
          browser.write_text(b)
          PY

          npm ci
          npm test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/app-tests.yml
          git add js/ui.js tests/manual-meal-flow-regressions.test.cjs browser-tests/ui-meal-editor-webkit.test.mjs .github/workflows/app-tests.yml
          git commit -m "Finish unified food log terminology integration"
          git push origin HEAD:refactor/unified-food-log

  test:
    needs: finalize-visible-terminology
    if: always() && (needs.finalize-visible-terminology.result == 'success' || needs.finalize-visible-terminology.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit UI regression
        run: npm run test:browser
