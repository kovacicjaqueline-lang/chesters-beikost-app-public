name: App regression tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/*.css'
      - 'sw.js'
      - 'sw-core.js'
      - 'app.js'
      - 'js/**'
      - 'data/**'
      - 'assets/illustrations-v2/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - '**/*.css'
      - 'sw.js'
      - 'sw-core.js'
      - 'app.js'
      - 'js/**'
      - 'data/**'
      - 'assets/illustrations-v2/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  icon-fast:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'icons/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard icon-only scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(assets/illustrations-v2/(foods|recipes)/[^/]+\.svg|js/icons\.js|sw-core\.js|tests/([^/]*icon[^/]*)\.test\.cjs|tests/legacy-recipe-assets-cleanup\.test\.cjs|tests/helpers/icon-integrity-(png|source)\.cjs)$' || true)"
          if [ -n "$invalid" ]; then
            echo "icons/* fast path contains files outside the approved icon scope:"
            printf '%s\n' "$invalid"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run icon verification gate
        run: npm run verify:icons

  test:
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'icons/') }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run app verification gate
        run: npm run verify:app

      - name: Upload plan checks UX screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: plan-checks-ux-screenshots-${{ github.run_id }}
          path: artifacts/browser-tests/plan-checks-ux-webkit/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics-${{ github.run_id }}
          path: artifacts/browser-tests/
          if-no-files-found: ignore
          retention-days: 7
