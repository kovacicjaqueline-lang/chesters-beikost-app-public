name: App regression tests

on:
  push:
    branches-ignore: [main]
    paths:
      - 'index.html'
      - '**/*.css'
      - 'sw.js'
      - 'sw-core.js'
      - 'app.js'
      - 'js/**'
      - 'data/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - '**/*.css'
      - 'sw.js'
      - 'sw-core.js'
      - 'app.js'
      - 'js/**'
      - 'data/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-tests.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/unified-food-log'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/unified-food-log
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed unified-log cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/unified-log-cleanup.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          npm ci"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace("r'\\.map\\(\\(log\\) => `\\$\\{log\\.date\\}\\|\\$\\{log\\.meal\\}`\\)'", "r'\\.map\\(\\(\\) => `\\$\\{log\\.date\\}\\|\\$\\{log\\.meal\\}`\\)'")
          script = script.replace("'.map((log) => typeof logExposureKey === \"function\" ? logExposureKey(log) : `${log.date}|${log.meal}`)'", "'.map(() => typeof logExposureKey === \"function\" ? logExposureKey(log) : `${log.date}|${log.meal}`)'")
          script += r'''
# Isolated Planner-Tests laden planning.js teilweise ohne log-core.js. Die Produktionsseite nutzt
# weiterhin log-core.js; diese Wrapper halten das Modul zusätzlich eigenständig testbar.
rep_all('js/planning.js', 'logHasMealContext(log)', 'plannerLogHasMealContext(log)')
rep_all('js/planning.js', '.map(logExposureKey)', '.map(plannerLogExposureKey)')
rep_all('js/planning.js', 'LOG_MEAL_KEYS.includes(meal)', 'plannerLogMealKeys().includes(meal)')
rep('js/planning.js',
    'let role = learningRoleLabel(rank(sample[0]), status(sample[0]), m.type || "");',
    'let role = plannerLearningRoleLabel(sample[0], m.type || "");')
planner_marker = 'function successfulMealSlotCount(on = today()) {'
planner_helpers = '''function plannerLogMealKeys() {\n  return typeof LOG_MEAL_KEYS !== "undefined" ? LOG_MEAL_KEYS : ["breakfast", "snack", "lunch", "dinner"];\n}\nfunction plannerLogHasMealContext(log) {\n  if (typeof logHasMealContext === "function") return logHasMealContext(log);\n  return !!log && log.entryType !== "sample" && plannerLogMealKeys().includes(String(log.meal || ""));\n}\nfunction plannerLogExposureKey(log) {\n  if (typeof logExposureKey === "function") return logExposureKey(log);\n  let date = String(log?.date || "");\n  if (plannerLogHasMealContext(log)) return `${date}|${log.meal}`;\n  let identity = String(log?.id || log?.createdAt || log?.updatedAt || "free");\n  return `${date}|entry:${identity}`;\n}\nfunction plannerLearningRoleLabel(item, type = "") {\n  if (typeof learningRoleLabel === "function") return learningRoleLabel(rank(item), status(item), type);\n  if (status(item) === "Pausiert") return "Pausiert";\n  if (rank(item) === 1 || ["gezielt wiederholen", "Allergen wiederholen", "nach Einführung"].includes(String(type || ""))) return "Wiederholung";\n  return "Einführung";\n}\n'''
rep('js/planning.js', planner_marker, planner_helpers + planner_marker)
'''
          Path('/tmp/unified-log-cleanup.py').write_text(script)
          PY
          python3 /tmp/unified-log-cleanup.py
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/app-tests.yml
          git rm .github/workflows/unified-log-cleanup.yml .github/workflows/unified-log-cleanup-run.yml .unified-log-cleanup-trigger
          git add app.js index.html sw.js js browser-tests tests .github/workflows/app-tests.yml
          git commit -m "Integrate unified food log canonically"
          git push origin HEAD:refactor/unified-food-log

  test:
    needs: cleanup
    if: always() && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit UI regression
        run: npm run test:browser
