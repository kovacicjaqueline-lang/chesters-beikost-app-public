name: Import clean main snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Import repository snapshot without Git history
        shell: bash
        run: |
          set -euo pipefail
          ZIP='beikost-public-snapshot.zip'
          test -f "$ZIP"

          rm -rf .snapshot-import .snapshot-keep
          mkdir -p .snapshot-import .snapshot-keep/.github/workflows
          cp .github/workflows/import-clean-snapshot.yml .snapshot-keep/.github/workflows/

          unzip -q "$ZIP" -d .snapshot-import
          ROOT="$(find .snapshot-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"

          rm -rf "$ROOT/.github/workflows"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.snapshot-import' \
            ! -name '.snapshot-keep' \
            ! -name "$ZIP" \
            -exec rm -rf {} +

          cp -a "$ROOT"/. .
          mkdir -p .github/workflows
          cp .snapshot-keep/.github/workflows/import-clean-snapshot.yml .github/workflows/

          rm -rf .snapshot-import .snapshot-keep "$ZIP"

      - name: Commit clean public snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import clean public snapshot from private main'
          git push
