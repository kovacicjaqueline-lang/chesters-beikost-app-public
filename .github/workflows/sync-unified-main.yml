name: Sync unified food log with main

on:
  push:
    branches:
      - refactor/unified-food-log

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-unified-main]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/unified-food-log
          fetch-depth: 0

      - name: Merge current main and resolve known overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' js/model.js js/planning.js js/statistics.js | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours js/model.js js/planning.js js/statistics.js
          fi

          python - <<'PY'
          from pathlib import Path

          model_path = Path('js/model.js')
          model = model_path.read_text()
          if 'const COUNT100_IDENTITY_BY_ID' not in model:
              marker = 'function learnedFoods() {'
              assert marker in model
              block = '''/*
           * FOOD-COUNT: Für das 100-Lebensmittel-Ziel zählt die ausdrücklich freigegebene
           * kulinarische Grundstoff-Identität, nicht jede Verarbeitungsform als neues FOOD.
           * Diese Zuordnung ist absichtlich getrennt von foodFamily/allergenFamily, weil
           * jene Felder Planner- und Allergenverhalten steuern.
           */
          const COUNT100_IDENTITY_BY_ID = Object.freeze({
            sesam: "sesam",
            tahin: "sesam",
            mais: "mais",
            "mais-polenta": "mais",
            polenta: "mais",
            hafer: "hafer",
            haferdrink: "hafer",
            weizen: "weizen",
            weizengriess: "weizen",
            bulgur: "weizen",
            couscous: "weizen",
            "nudeln-pasta": "weizen",
            brot: "weizen",
          });
          function count100Identity(foodOrId, name = "") {
            let id = typeof foodOrId === "object" ? foodOrId?.id : foodOrId;
            let foodName = typeof foodOrId === "object" ? foodOrId?.name : name;
            let canonical = canonicalId(id || "", foodName || "");
            return COUNT100_IDENTITY_BY_ID[canonical] || canonical;
          }
          '''
              model = model.replace(marker, block + marker, 1)

          old_learned = '''function learnedFoods() {
            return state.foods
              .filter((f) => f.count100 && rank(f) >= 1)
              .sort((a, b) => a.priority - b.priority);
          }'''
          new_learned = '''function learnedFoods() {
            let seen = new Set();
            return state.foods
              .filter((f) => f.count100 && rank(f) >= 1)
              .sort((a, b) => a.priority - b.priority)
              .filter((f) => {
                let identity = count100Identity(f);
                if (!identity || seen.has(identity)) return false;
                seen.add(identity);
                return true;
              });
          }'''
          if old_learned in model:
              model = model.replace(old_learned, new_learned, 1)
          assert 'const COUNT100_IDENTITY_BY_ID' in model
          assert 'let identity = count100Identity(f);' in model
          assert 'automatisch aus einer Einführung oder Wiederholung' in model
          assert 'modelExposureKey' in model
          model_path.write_text(model)

          planning_path = Path('js/planning.js')
          planning = planning_path.read_text()
          old_season = 'if (phMode !== "travel" && state.settings.seasonal && isSeason(f, on)) p -= 3;'
          new_season = 'if (phMode !== "travel" && state.settings.seasonal && f.seasonMonths?.length && isSeason(f, on)) p -= 3;'
          if old_season in planning:
              planning = planning.replace(old_season, new_season, 1)
          assert new_season in planning
          assert 'function followUpMealForLog' in planning
          assert 'if (!meal) return { ok: true, date: "", unplanned: true };' in planning
          planning_path.write_text(planning)

          statistics_path = Path('js/statistics.js')
          statistics = statistics_path.read_text()
          statistics = statistics.replace('totalLearned: uniqueTriedCount(),', 'totalLearned: learnedFoods().length,', 1)
          assert 'totalLearned: learnedFoods().length,' in statistics
          assert 'introducedCount: introducedFoodIds.size' in statistics
          statistics_path.write_text(statistics)
          PY

          git add -A
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests on merged tree
        run: npm test

      - name: Commit merge and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-unified-main.yml
          git add -A
          git commit -m "Merge current main into unified food log [sync-unified-main]"
          git push origin HEAD:refactor/unified-food-log
