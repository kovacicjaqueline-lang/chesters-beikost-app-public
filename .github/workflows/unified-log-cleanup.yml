name: Unified log cleanup

on:
  push:
    branches:
      - refactor/unified-food-log
    paths:
      - '.github/workflows/unified-log-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-food-log
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate unified log canonically
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = subprocess.check_output(
              ["git", "show", "3422b33222e45d5f2c9685ce63df809fb7a54333:.github/workflows/unified-log-cleanup.yml"],
              text=True,
          )
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          npm ci"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])

          # Der ursprüngliche Patch suchte im Familienzähler nach einer äußeren map(log)-Form;
          # tatsächlich liegt dort die innere map(() => ...)-Form vor.
          script = script.replace(
              "r'\\.map\\(\\(log\\) => `\\$\\{log\\.date\\}\\|\\$\\{log\\.meal\\}`\\)'",
              "r'\\.map\\(\\(\\) => `\\$\\{log\\.date\\}\\|\\$\\{log\\.meal\\}`\\)'",
          )
          script = script.replace(
              "'.map((log) => typeof logExposureKey === \"function\" ? logExposureKey(log) : `${log.date}|${log.meal}`)'",
              "'.map(() => typeof logExposureKey === \"function\" ? logExposureKey(log) : `${log.date}|${log.meal}`)'",
          )

          namespace = {}
          exec(compile(script, "unified-log-cleanup", "exec"), namespace, namespace)
          rep = namespace["rep"]
          rep_all = namespace["rep_all"]

          # Isolierte Planner-Tests laden planning.js teilweise ohne log-core.js.
          # In der Browser-App bleibt log-core.js die kanonische Quelle; lokale Wrapper halten
          # planning.js zugleich eigenständig testbar, ohne die Fachlogik zu duplizieren.
          rep_all('js/planning.js', 'logHasMealContext(log)', 'plannerLogHasMealContext(log)')
          rep_all('js/planning.js', '.map(logExposureKey)', '.map(plannerLogExposureKey)')
          rep_all('js/planning.js', 'LOG_MEAL_KEYS.includes(meal)', 'plannerLogMealKeys().includes(meal)')
          rep(
              'js/planning.js',
              'let role = learningRoleLabel(rank(sample[0]), status(sample[0]), m.type || "");',
              'let role = plannerLearningRoleLabel(sample[0], m.type || "");',
          )
          marker = 'function successfulMealSlotCount(on = today()) {'
          helpers = '''function plannerLogMealKeys() {\n  return typeof LOG_MEAL_KEYS !== "undefined" ? LOG_MEAL_KEYS : ["breakfast", "snack", "lunch", "dinner"];\n}\nfunction plannerLogHasMealContext(log) {\n  if (typeof logHasMealContext === "function") return logHasMealContext(log);\n  return !!log && log.entryType !== "sample" && plannerLogMealKeys().includes(String(log.meal || ""));\n}\nfunction plannerLogExposureKey(log) {\n  if (typeof logExposureKey === "function") return logExposureKey(log);\n  let date = String(log?.date || "");\n  if (plannerLogHasMealContext(log)) return `${date}|${log.meal}`;\n  let identity = String(log?.id || log?.createdAt || log?.updatedAt || "free");\n  return `${date}|entry:${identity}`;\n}\nfunction plannerLearningRoleLabel(item, type = "") {\n  if (typeof learningRoleLabel === "function") return learningRoleLabel(rank(item), status(item), type);\n  if (status(item) === "Pausiert") return "Pausiert";\n  if (rank(item) === 1 || ["gezielt wiederholen", "Allergen wiederholen", "nach Einführung"].includes(String(type || ""))) return "Wiederholung";\n  return "Einführung";\n}\n'''
          rep('js/planning.js', marker, helpers + marker)
          PY

          npm ci
          npm test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/unified-log-cleanup.yml
          git add app.js index.html sw.js js browser-tests tests
          git commit -m "Integrate unified food log canonically"
          git push origin HEAD:refactor/unified-food-log
