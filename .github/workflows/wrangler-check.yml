name: Wrangler deploy check

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'wrangler.jsonc'
      - '.wrangler/deploy/config.json'
      - '.assetsignore'
      - '.gitignore'
      - '.github/workflows/wrangler-check.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'wrangler.jsonc'
      - '.wrangler/deploy/config.json'
      - '.assetsignore'
      - '.gitignore'
      - '.github/workflows/wrangler-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deployment verification gate
        run: npm run verify:deploy
